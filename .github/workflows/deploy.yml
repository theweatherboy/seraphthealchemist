name: Validate website

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:accounts
      - run: npm run build
      - run: npm run test:auth
# Vercel's Git integration handles hosting. Auth routes require a server,
# so GitHub Pages/static out exports are no longer used.
